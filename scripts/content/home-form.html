<section id="homepage-inquiry"><h2>Send Us Your Requirements</h2><p>Tell us about your research question and dataset. Do not include confidential records.</p><form action="https://formspree.io/f/xwlegzkn" method="POST" id="requirementsForm">
<p><a href="/inquiry/">Use the guided research inquiry →</a></p><input type="text" name="_gotcha" tabindex="-1" aria-hidden="true" style="position:absolute;left:-10000px" autocomplete="off">
            <input type="hidden" name="_subject" value="New Angsumi Project / Data Inquiry">
            <input type="hidden" name="_next" value="https://angsumi.online/">

            <!-- Field: Your Name -->
            <div class="field-group">
              <label for="form_name">Your Name</label>
              <div class="input-icon-wrap">

                <input id="form_name" required name="name" type="text" placeholder="Enter your full name">
              </div>
            </div>

            <!-- Row: Phone & Email -->
            <div class="form-grid-row">
              <div class="field-group">
                <label for="form_phone">Phone / WhatsApp Number</label>
                <div class="input-icon-wrap">

                  <input id="form_phone" name="phone" type="tel" placeholder="+91 78965 95109">
                </div>
              </div>
              <div class="field-group">
                <label for="form_email">Your Email Address</label>
                <div class="input-icon-wrap">

                  <input id="form_email" required name="email" type="email" placeholder="you@example.com">
                </div>
              </div>
            </div>

            <!-- Row: What do you represent & What service do you need -->
            <div class="form-grid-row">
              <div class="field-group">
                <label for="form_represent">What do you represent?</label>
                <div class="select-wrap">
                  <select id="form_represent" required name="business_type">
                    <option value="" disabled selected>Select an option</option>
                    <option value="Researcher / Academic / University">🎓 &nbsp;Researcher / Academic / University</option>




                    <option value="Biotech / Pharma Startup">🔬 &nbsp;Biotech / Pharma Startup</option>

                  </select>

                </div>
              </div>
              <div class="field-group">
                <label for="form_service">What service do you need?</label>
                <div class="select-wrap">
                  <select id="form_service" required name="project_type">
                    <option value="" disabled selected>Select an option</option>
                    <option value="Bioinformatics & Genomic Data Analysis">🧬 &nbsp;Bioinformatics &amp; Genomic Data Analysis</option>
                    <option value="Statistical / Scientific Data Analysis (R/Python)">📊 &nbsp;Statistical / Scientific Data Analysis (R/Python)</option>





                    <option value="Not sure yet — Need Consultation">❓ &nbsp;Not sure yet — Need Consultation</option>
                  </select>

                </div>
              </div>
            </div>

            <!-- Row: Approximate Budget & Brief Project Details -->
            <div class="form-grid-row form-grid-bottom">
              <div class="field-group">
                <label for="form_budget">Approximate Budget</label>
                <div class="select-wrap">
                  <select id="form_budget" required name="budget">
                    <option value="" disabled selected>Select an option</option>
                    <option value="Under ₹5,000">🪙 &nbsp;Under ₹5,000</option>
                    <option value="₹5,000 – ₹15,000">🪙 &nbsp;₹5,000 – ₹15,000</option>
                    <option value="₹15,000 – ₹30,000">🪙 &nbsp;₹15,000 – ₹30,000</option>
                    <option value="₹30,000+">🪙 &nbsp;₹30,000+</option>
                    <option value="Flexible / Discuss First">💬 &nbsp;Flexible / Discuss First</option>
                  </select>

                </div>
              </div>
              <div class="field-group">
                <label for="form_details">Brief Project Details</label>
                <div class="textarea-icon-wrap">

                  <textarea id="form_details" required name="project_details" placeholder="Describe your dataset, research question and the analysis you need..." maxlength="1000"></textarea>

                </div>
              </div>
            </div>

            <!-- Submit Button -->
            <button class="glass-submit-btn" type="submit">

              <span>Get Free Proposal / Blueprint</span>
              <span class="btn-arrow">&rarr;</span>
            </button>

            <label style="display:flex;gap:12px;align-items:flex-start;margin:16px 0"><input id="legacy-consent" type="checkbox" required name="contact_consent"><span>You may contact me about this inquiry. <a href="/privacy-policy/">Privacy notice</a>. Do not include confidential records.</span></label>
<!-- Trust Badge -->
            <div class="form-trust-footer">

              <span>We use these details to review and reply to your inquiry. Please do not include confidential records.</span>
            </div>
          </form></section>
