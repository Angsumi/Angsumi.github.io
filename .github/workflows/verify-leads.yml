name: Verify lead system
on:
  pull_request:
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/analytics.test.cjs
      - run: node tests/supabase.test.mjs
      - run: python3 scripts/check_growth.py
      - run: python3 scripts/build_public.py
